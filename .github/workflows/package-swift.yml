name: Package Swift

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to package
        type: choice
        default: all
        options:
          - all
          - x64
          - arm64

permissions:
  contents: read

jobs:
  package-mac:
    name: package-mac-${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'x64' && 'macos-26-intel' || 'macos-26' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.target == 'x64' && '["x64"]' || inputs.target == 'arm64' && '["arm64"]' || '["x64","arm64"]') }}
    env:
      EVERYWHERE_BUNDLE_MFI_IDENTITY: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - name: Build Intel cryptography with static OpenSSL
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          set -euo pipefail
          prefix=$(brew --prefix openssl@3)
          if [[ ! -f "$prefix/lib/libssl.a" || ! -f "$prefix/lib/libcrypto.a" ]]; then
            brew install openssl@3
          fi
          python -m venv "$RUNNER_TEMP/portable-x64"
          py="$RUNNER_TEMP/portable-x64/bin/python"
          OPENSSL_DIR="$prefix" OPENSSL_STATIC=1 "$py" -m pip install \
            --no-cache-dir --no-binary=cryptography 'PyInstaller>=6,<7' \
            -r swift/Host/ModernBackend/requirements.txt

          # PyInstaller 会把同名 dylib 收集到同一个目录。确保 Rust 扩展无需加载 Python 自带的 OpenSSL。
          binding=$("$py" -c 'from cryptography.hazmat.bindings import _rust; print(_rust.__file__)')
          xcrun lipo "$binding" -verify_arch x86_64
          links=$(xcrun otool -L "$binding")
          if grep -Eq '^[[:space:]]*([^[:space:]]*/)?lib(ssl|crypto)(\.[0-9]+)*\.dylib[[:space:]]' <<< "$links"; then
            echo "::error::Intel cryptography still links to a shared OpenSSL library"
            printf '%s\n' "$links"
            exit 1
          fi
          echo "EVERYWHERE_PORTABLE_PYTHON=$py" >> "$GITHUB_ENV"
      - uses: ./.github/actions/prepare-mfi
      - name: Package Swift MacHost and verify its architecture
        env:
          MACHO_ARCH: ${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}
        run: |
          test "$(uname -m)" = "$MACHO_ARCH"
          ./package.sh --mac-only Build/Exports
          bundles=(Build/Exports/Everywhere-mac-*/Everywhere.app)
          test "${#bundles[@]}" -eq 1
          app="${bundles[0]}"
          for binary in Contents/MacOS/MacHost Contents/Helpers/DeviceLocation.app/Contents/MacOS/DeviceLocation Contents/Helpers/AccessoryLocation.app/Contents/MacOS/accessory-location; do
            xcrun lipo "$app/$binary" -verify_arch "$MACHO_ARCH"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: package-mac-${{ matrix.arch }}
          path: Build/Exports/Everywhere-mac-*/Everywhere-macOS.zip
          if-no-files-found: error
          compression-level: 0
